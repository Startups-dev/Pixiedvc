<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your PixieDVC account</title>
  </head>
  <body style="margin:0;background:#f8fafc;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:18px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:#64748b;">PixieDVC</p>
                <h1 style="margin:0 0 16px;font-size:24px;line-height:1.25;color:#0f172a;">Confirm your account</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#334155;">
                  Confirm your email address to finish setting up your PixieDVC account.
                </p>
                <p style="margin:0 0 28px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;border-radius:12px;background:#1d4ed8;color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;padding:13px 22px;">
                    Confirm email
                  </a>
                </p>
                <p style="margin:0;font-size:12px;line-height:1.6;color:#64748b;">
                  If the button does not work, copy and paste this link into your browser:<br />
                  <a href="{{ .ConfirmationURL }}" style="color:#1d4ed8;word-break:break-all;">{{ .ConfirmationURL }}</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
