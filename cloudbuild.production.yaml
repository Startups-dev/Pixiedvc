steps:
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        if [[ -z "${_NEXT_PUBLIC_SITE_URL}" ]]; then
          echo "Missing required Cloud Build substitution: _NEXT_PUBLIC_SITE_URL"
          exit 1
        fi
        if [[ -z "${_NEXT_PUBLIC_APP_URL}" ]]; then
          echo "Missing required Cloud Build substitution: _NEXT_PUBLIC_APP_URL"
          exit 1
        fi
        if [[ -z "${_NEXT_PUBLIC_SUPABASE_URL}" ]]; then
          echo "Missing required Cloud Build substitution: _NEXT_PUBLIC_SUPABASE_URL"
          exit 1
        fi
        if [[ -z "${_NEXT_PUBLIC_SUPABASE_ANON_KEY}" ]]; then
          echo "Missing required Cloud Build substitution: _NEXT_PUBLIC_SUPABASE_ANON_KEY"
          exit 1
        fi

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/web:${_IMAGE_TAG}"
      - "--build-arg"
      - "NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}"
      - "--build-arg"
      - "NEXT_PUBLIC_GOOGLE_PLACES_API_KEY=${_NEXT_PUBLIC_GOOGLE_PLACES_API_KEY}"
      - "--build-arg"
      - "NEXT_PUBLIC_INTERCOM_APP_ID=${_NEXT_PUBLIC_INTERCOM_APP_ID}"
      - "."

- name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
  entrypoint: "gcloud"
  args:
    - "run"
    - "deploy"
    - "pixiedvc-production"
    - "--image"
    - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/web:${_IMAGE_TAG}"
    - "--region"
    - "${_REGION}"
    - "--platform"
    - "managed"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/web:${_IMAGE_TAG}"

substitutions:
  _REGION: "us-central1"
  _AR_REPOSITORY: "pixiedvc"
  _IMAGE_TAG: "production"
  _NEXT_PUBLIC_SITE_URL: "https://hannadvc.com"
  _NEXT_PUBLIC_APP_URL: "https://hannadvc.com"
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  _NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: ""
  _NEXT_PUBLIC_INTERCOM_APP_ID: ""

options:
  logging: CLOUD_LOGGING_ONLY
