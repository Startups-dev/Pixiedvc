# Example direct production env file for scripts/gcp/deploy-production.sh.
# Copy to env-production.local.yaml or env-production.yaml and fill real values.
# These local production env files are gitignored.
NODE_ENV: "production"
NEXT_PUBLIC_SITE_URL: "https://pixiedvc.com"
NEXT_PUBLIC_APP_URL: "https://pixiedvc.com"
APP_BASE_URL: "https://pixiedvc.com"
APP_TIMEZONE: "America/New_York"
MATCH_USE_YEAR_BUCKETS: "1"

# Required for direct-env production launch:
NEXT_PUBLIC_SUPABASE_URL: "__SET_PRODUCTION_VALUE__"
NEXT_PUBLIC_SUPABASE_ANON_KEY: "__SET_PRODUCTION_VALUE__"
SUPABASE_SERVICE_ROLE_KEY: "__SET_PRODUCTION_VALUE__"
RESEND_API_KEY: "__SET_PRODUCTION_VALUE__"
RESEND_FROM_EMAIL: "__SET_PRODUCTION_VALUE__"
STRIPE_SECRET_KEY: "__SET_PRODUCTION_VALUE__"
STRIPE_WEBHOOK_SECRET: "__SET_PRODUCTION_VALUE__"
NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: "__SET_PRODUCTION_VALUE__"
GOOGLE_PLACES_API_KEY: "__SET_PRODUCTION_VALUE__"
OPENAI_API_KEY: "__SET_PRODUCTION_VALUE__"
GEMINI_API_KEY: "__SET_PRODUCTION_VALUE__"
PIXIE_MODEL: "gpt-5.6-sol"
PIXIE_PUBLIC_ENABLED: "false"
PIXIE_MAX_OUTPUT_TOKENS: "1200"
PIXIE_MODEL_TIMEOUT_MS: "12000"
PIXIE_MAX_TOOL_ROUNDS: "2"
PIXIE_MAX_INPUT_CHARS: "4000"
PIXIE_MAX_RECENT_MESSAGES: "6"
PIXIE_RATE_LIMIT_WINDOW_MS: "60000"
PIXIE_RATE_LIMIT_MAX_REQUESTS: "12"
ADMIN_EMAILS: "__SET_PRODUCTION_VALUE__"
NEXT_PUBLIC_ADMIN_EMAILS: "__SET_PRODUCTION_VALUE__"
CRON_SECRET: "__SET_PRODUCTION_VALUE__"

# Optional production integrations, when enabled:
# NEXT_PUBLIC_INTERCOM_APP_ID
# CONCIERGE_HANDOFF_EMAIL
# SUPPORT_LIVE_GUEST_SECRET
# TWILIO_ACCOUNT_SID
# TWILIO_AUTH_TOKEN
# TWILIO_API_KEY_SID
# TWILIO_API_KEY_SECRET
# TWILIO_CONVERSATIONS_SERVICE_SID
# WELCOME_SEQUENCE_DAY_0_HERO_IMAGE_URL
# WELCOME_SEQUENCE_DAY_0_SECONDARY_IMAGE_URL
# FOUNDING_OWNER_LAUNCH_ENABLED
# ABANDONED_BOOKING_DELAY_MINUTES
# OWNER_MATCH_REMINDER_HOURS
# UNSIGNED_AGREEMENT_REMINDER_HOURS
